[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkage-qa"
version = "0.1.0"
description = "Probabilistic record linkage with an auditable quality assurance framework"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.11", "jellyfish>=1.0", "recordlinkage>=0.16", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
