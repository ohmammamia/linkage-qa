[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkage-qa"
version = "0.1.0"
description = "Probabilistic record linkage with an auditable quality assurance framework"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.11", "jellyfish>=1.0", "recordlinkage>=0.16", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

# `ruff check .` is clean on this rule set. It is not yet wired into
# .github/workflows/tests.yml -- add `- run: ruff check .` before the pytest
# step to enforce it.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
